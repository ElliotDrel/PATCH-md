name: Specification proposal
description: Propose a change grounded in a real fork-maintenance problem.
title: "spec: "
labels: [specification]
body:
  - type: textarea
    id: problem
    attributes:
      label: Maintenance problem
      description: Describe the real fork and failure this proposal addresses.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest proposed change
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
    validations:
      required: true
